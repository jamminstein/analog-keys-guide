<body><div class="wrap"><a href="analog-keys-facets-index.html">← all guides</a><h1>9) Tempo and Swing</h1>
<div class="step"><strong>1. Play</strong><br>Start a pattern.</div>
<div class="step"><strong>2. Set tempo</strong><br>Press <span class="k">TEMPO</span>; turn the Sound Selection wheel.</div>
<div class="step"><strong>3. Tap tempo</strong><br>Hold <span class="k">FUNCTION</span> and tap <span class="k">TEMPO</span> four times.</div>
<div class="step"><strong>4. Add swing</strong><br><span class="k">FUNCTION</span> + <span class="k">PATTERN</span>.</div>
<div class="step"><strong>5. Listen</strong><br>Raise swing slowly until the groove leans.</div>
