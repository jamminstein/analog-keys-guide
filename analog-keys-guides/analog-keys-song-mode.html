<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Build a Song</title>
<style>body{margin:0;padding:16px;font-family:system-ui;background:#10192f;color:#f4f6ff}.wrap{max-width:720px;margin:auto;background:#ffffff10;border:1px solid #ffffff2a;border-radius:14px;padding:16px}h1{font-size:1.35rem;margin:0 0 12px}.k{font-weight:700;color:#ffd6ad;padding:0 6px;border:1px solid #ffd6ad66;border-radius:8px;background:#ffd6ad16}.step{margin:10px 0;padding:10px;border-radius:10px;background:#0f1730}a{color:#9ff8ce}</style></head>
<body><div class="wrap"><a href="analog-keys-facets-index.html">← all guides</a><h1>14) Build a Song</h1>
<div class="step"><strong>1. Edit</strong><br><span class="k">FUNCTION</span> + <span class="k">SONG MODE</span>.</div>
<div class="step"><strong>2. Add a row</strong><br><span class="k">FUNCTION</span> + <span class="k">YES/SAVE</span>.</div>
<div class="step"><strong>3. Choose pattern</strong><br>Highlight the pattern, then use <span class="k">BANK</span> + <span class="k">TRIG</span>.</div>
<div class="step"><strong>4. Add another row</strong><br>Repeat with a different pattern.</div>
<div class="step"><strong>5. Play from start</strong><br>Press <span class="k">STOP</span> twice, then <span class="k">PLAY</span>.</div>
<div class="step"><strong>6. Use Song mode</strong><br>Press <span class="k">SONG MODE</span>.</div>
</div></body></html>
