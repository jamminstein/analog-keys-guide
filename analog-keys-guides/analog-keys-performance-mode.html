<body><div class="wrap"><a href="analog-keys-facets-index.html">← all guides</a><h1>13) Perform with Macros</h1>
<div class="step"><strong>1. Play</strong><br>Start a factory pattern.</div>
<div class="step"><strong>2. Enter</strong><br>Press <span class="k">PERFORMANCE</span>.</div>
<div class="step"><strong>3. Explore</strong><br>Turn the ten Data Entry knobs.</div>
<div class="step"><strong>4. Mute</strong><br>Use trigs <span class="k">1–6</span> to mute tracks.</div>
<div class="step"><strong>5. Mix</strong><br>Press <span class="k">PERFORMANCE</span> again; use knobs A–E.</div>
<div class="step"><strong>6. Customize later</strong><br><span class="k">FUNCTION</span> + <span class="k">PERFORMANCE</span> opens macro setup.</div>
</div></body></html>
