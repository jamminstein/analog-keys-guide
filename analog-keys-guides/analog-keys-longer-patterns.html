<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Make Longer Patterns</title>

<body><div class="wrap"><a href="analog-keys-facets-index.html">← all guides</a><h1>10) Make Longer Patterns</h1>
<div class="step"><strong>1. Open Scale</strong><br><span class="k">FUNCTION</span> + <span class="k">PAGE</span>.</div>
<div class="step"><strong>2. Set length</strong><br>Change the pattern from 16 to 32 steps.</div>
<div class="step"><strong>3. Return</strong><br>Exit the menu and press <span class="k">REC</span>.</div>
<div class="step"><strong>4. Change page</strong><br>Press <span class="k">PAGE</span> to reach steps 17–32.</div>
<div class="step"><strong>5. Add variation</strong><br>Put different notes on page 2.</div>
<div class="step"><strong>6. Listen</strong><br>Press <span class="k">PLAY</span>.</div>
</div></body></html>
