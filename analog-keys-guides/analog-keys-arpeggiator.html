<body><div class="wrap"><a href="analog-keys-facets-index.html">← all guides</a><h1>11) Use the Arpeggiator</h1>
<div class="step"><strong>1. Select</strong><br>Choose a synth <span class="k">TRACK</span>.</div>
<div class="step"><strong>2. Open</strong><br>Press <span class="k">ARP</span>.</div>
<div class="step"><strong>3. Activate</strong><br>Change <span class="k">MOD</span> from OFF to UP.</div>
<div class="step"><strong>4. Play</strong><br>Hold a chord on the keyboard.</div>
<div class="step"><strong>5. Explore</strong><br>Change <span class="k">SPD</span> and <span class="k">RNG</span>.</div>
<div class="step"><strong>6. Sequence it</strong><br>Record held notes into a pattern.</div>
</div></body></html>
