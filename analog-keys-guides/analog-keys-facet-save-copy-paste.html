<body><div class="wrap">
  <a href="analog-keys-facets-index.html">← all guides</a>
  <h1>6) Make Pattern Variations</h1>
  <div class="step"><strong>1. Copy</strong><br>Exit grid mode. Press <span class="k">FUNCTION</span> + <span class="k">REC</span>.</div>
  <div class="step"><strong>2. Choose</strong><br>Select another pattern slot.</div>
  <div class="step"><strong>3. Paste</strong><br><span class="k">FUNCTION</span> + <span class="k">STOP</span>.</div>
  <div class="step"><strong>4. Change it</strong><br>Remove trigs, add locks, or mute a track.</div>
  <div class="step"><strong>5. Compare</strong><br>Switch between the original and variation.</div>
  <div class="step"><strong>6. Undo paste</strong><br>Repeat <span class="k">FUNCTION</span> + <span class="k">STOP</span>.</div>
</div></body>
